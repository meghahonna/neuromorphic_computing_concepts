TIME_WINDOW = 50   # simulation timesteps
NUM_CHANNELS = 8   # input spike channels

def encode_transaction(row, vendor_stats):
    """Convert a single P2P transaction to spike train.

    Channels:
      0: PO creation spike
      1: Goods receipt spike
      2: Invoice spike
      3: PO→GR delay (rate-coded)
      4: GR→Invoice delay (rate-coded)
      5: Amount deviation from vendor avg (rate-coded)
      6: Invoice/PO amount ratio (rate-coded)
      7: Vendor activity burst (rate-coded)
    """
    spikes = torch.zeros(TIME_WINDOW, NUM_CHANNELS)

    # --- Event timing spikes (channels 0-2) ---
    # Map dates to timesteps within the window
    dates = [row['po_date'], row['gr_date'], row['inv_date']]
    min_date = min(dates)
    max_date = max(dates)
    span = max((max_date - min_date).days, 1)

    for ch, d in enumerate(dates):
        t = int(((d - min_date).days / span)
                * (TIME_WINDOW - 1))
        spikes[t, ch] = 1.0

    # --- Temporal delay features (channels 3-4) ---
    po_gr_delay = (row['gr_date'] - row['po_date']).days
    gr_inv_delay = (row['inv_date'] - row['gr_date']).days

    v_stats = vendor_stats.get(row['vendor_id'], {})
    avg_lead = v_stats.get('avg_lead', 10)

    # Deviation from normal → spike rate
    # Higher deviation = more spikes
    delay_dev = abs(po_gr_delay - avg_lead) / max(avg_lead, 1)
    delay_rate = min(delay_dev, 1.0)
    spikes[:, 3] = (torch.rand(TIME_WINDOW) < delay_rate
                    ).float()

    inv_delay_norm = min(gr_inv_delay / 14.0, 1.0)
    # Invoice before receipt → negative = high spike rate
    if gr_inv_delay < 0:
        spikes[:, 4] = 1.0  # max firing = anomaly
    else:
        spikes[:, 4] = (torch.rand(TIME_WINDOW)
                        < inv_delay_norm * 0.3).float()

    # --- Amount features (channels 5-6) ---
    avg_amt = v_stats.get('avg_amount', row['po_amount'])
    amt_dev = abs(row['inv_amount'] - avg_amt) / max(avg_amt, 1)
    amt_rate = min(amt_dev, 1.0)
    spikes[:, 5] = (torch.rand(TIME_WINDOW) < amt_rate
                    ).float()

    ratio = row['inv_amount'] / max(row['po_amount'], 0.01)
    ratio_dev = abs(ratio - 1.0)
    spikes[:, 6] = (torch.rand(TIME_WINDOW)
                    < min(ratio_dev * 5, 1.0)).float()

    # --- Vendor burst (channel 7) ---
    burst = v_stats.get('recent_burst', 0.0)
    spikes[:, 7] = (torch.rand(TIME_WINDOW) < burst
                    ).float()

    return spikes

# Build vendor statistics from data
vendor_stats = {}

    vendor_stats[v] = {

import snntorch as snn
from snntorch import surrogate

spike_grad = surrogate.fast_sigmoid(slope=25)

class FraudSNN(nn.Module):
    """Spiking Neural Network for P2P fraud detection.

    Architecture:
      Input (8 channels)
        → fc1 (64) → LIF₁ (recurrent, β=0.9)
        → fc2 (32) → LIF₂ (recurrent, β=0.85)
        → fc3 (2)  → LIF₃ (output, β=0.8)

    Recurrent connections let the network accumulate
    evidence across the full 50-timestep window.
    The output neuron that fires most = prediction.
    """

    def __init__(self):
        super().__init__()

        # Layer 1: Feature extraction
        self.fc1 = nn.Linear(8, 64)
        self.bn1 = nn.BatchNorm1d(64)
        self.lif1 = snn.RLeaky(
            beta=0.9,
            linear_features=64,  # recurrent connections
            spike_grad=spike_grad,
            learn_beta=True,     # let β adapt during training
        )

        # Layer 2: Pattern integration
        self.fc2 = nn.Linear(64, 32)
        self.lif2 = snn.RLeaky(
            beta=0.85,
            linear_features=32,
            spike_grad=spike_grad,
            learn_beta=True,
        )

        # Layer 3: Decision
        self.fc3 = nn.Linear(32, 2)  # [legitimate, fraud]
        self.lif3 = snn.Leaky(
            beta=0.8,
            spike_grad=spike_grad,
            learn_beta=True,
        )

        self.dropout = nn.Dropout(0.2)

    def forward(self, x):
        """
        Args:
            x: (batch, timesteps, channels) spike tensor
        Returns:
            spk_rec: (timesteps, batch, 2) output spikes
            mem_rec: (timesteps, batch, 2) membrane traces
        """
        batch_size = x.shape[0]

        # Initialize hidden states
        spk1, mem1 = self.lif1.init_rleaky()
        spk2, mem2 = self.lif2.init_rleaky()
        mem3 = self.lif3.init_leaky()

        spk3_rec = []
        mem3_rec = []

        # Process each timestep
        for t in range(x.shape[1]):
            inp = x[:, t, :]  # (batch, 8)

            cur1 = self.bn1(self.fc1(inp))
            spk1, mem1 = self.lif1(cur1, spk1, mem1)

            cur2 = self.fc2(self.dropout(spk1))
            spk2, mem2 = self.lif2(cur2, spk2, mem2)

            cur3 = self.fc3(spk2)
            spk3, mem3 = self.lif3(cur3, mem3)

            spk3_rec.append(spk3)
            mem3_rec.append(mem3)

        return (torch.stack(spk3_rec),
                torch.stack(mem3_rec))

model = FraudSNN()
total_params = sum(p.numel() for p in model.parameters())
print(f"FraudSNN initialized")
print(f"  Parameters: {total_params:,}")
print(f"  Architecture: 8 → 64 (RLeaky) → 32 (RLeaky) → 2")
print(f"  Recurrent: Yes (layers 1-2)")
print(f"  Learnable β: Yes (all layers)")`,filename:"fraud_snn.py",notes:["RLeaky (recurrent LIF) neurons maintain hidden state across timesteps — critical for detecting temporal fraud patterns","Learnable β: the network discovers optimal decay rates per neuron during training","BatchNorm stabilizes training for sparse spiking inputs","Dropout prevents overfitting on the minority fraud class","2-class output: neuron 0 = legitimate, neuron 1 = fraud. Most spikes wins."]},{step:5,title:"Train & Evaluate",icon:hS,color:"text-emerald-400",desc:"Train with class-weighted loss (fraud is rare!) and evaluate with precision, recall, and F1 — the metrics auditors actually care about.",code:`from torch.utils.data import DataLoader, TensorDataset
from sklearn.model_selection import train_test_split

train_ds = TensorDataset(X_train, y_train)

weights = torch.tensor([clean_weight, fraud_weight])

from sklearn.metrics import (precision_recall_fscore_support,
    roc_auc_score, confusion_matrix)

# ──── Traditional Rule-Based Matching ────
def rule_based_matching(df, amt_threshold=0.02,
                        timing_threshold=0):
    """Standard 3-way match rules used in most ERPs.

    Flags if:
      1. Invoice amount differs from PO by > threshold
      2. Invoice date is before goods receipt date
      3. Duplicate: same vendor + amount within 3 days
    """
    flags = np.zeros(len(df), dtype=int)

    for i, row in df.iterrows():
        # Rule 1: Amount mismatch
        amt_diff = abs(row.inv_amount - row.po_amount
                      ) / row.po_amount
        if amt_diff > amt_threshold:
            flags[i] = 1
            continue

        # Rule 2: Timing violation
        if row.inv_date < row.gr_date:
            flags[i] = 1
            continue

        # Rule 3: Duplicate detection
        dupes = df[
            (df.vendor_id == row.vendor_id) &
            (abs((df.inv_date - row.inv_date).dt.days) <= 3) &
            (abs(df.inv_amount - row.inv_amount) < 0.01) &
            (df.index != i)
        ]
        if len(dupes) > 0:
            flags[i] = 1

    return flags

# Run rule-based on test set
rule_preds = rule_based_matching(test_df)

# ──── SNN predictions (already computed) ────
snn_preds = np.array(all_preds)

# ──── Head-to-head comparison ────
def eval_method(name, preds, labels):
    p, r, f1, _ = precision_recall_fscore_support(
        labels, preds, pos_label=1, average='binary')
    tn, fp, fn, tp = confusion_matrix(labels, preds).ravel()
    fpr = fp / (fp + tn)  # false positive rate
    print(f"\\n{'='*45}")
    print(f"  {name}")
    print(f"{'='*45}")
    print(f"  Precision:    {p:.3f}  (flagged items"
          f" that ARE fraud)")
    print(f"  Recall:       {r:.3f}  (fraud caught)")
    print(f"  F1-Score:     {f1:.3f}")
    print(f"  False Pos Rate: {fpr:.3f}  (clean items"
          f" wrongly flagged)")
    print(f"  TP: {tp} | FP: {fp} | FN: {fn} | TN: {tn}")
    return {'precision': p, 'recall': r, 'f1': f1, 'fpr': fpr}

def explain_flagged_transaction(model, transaction_spikes,
                                 txn_info, save_path=None):
    """Generate an auditor-friendly explanation dashboard
    for a flagged transaction.

      2. Channel firing rates (which features are hot)
      3. Membrane potential trace (how decision builds)
      4. Transaction details & risk factors
    """
    model.eval()
    x = transaction_spikes.unsqueeze(0)

    with torch.no_grad():
        spk_rec, mem_rec = model(x)

    spikes = x[0].numpy()        # (T, 8)
    membrane = mem_rec[:, 0, :].numpy()  # (T, 2)
    out_spikes = spk_rec[:, 0, :].numpy()

    fig = plt.figure(figsize=(14, 8),
                     facecolor='#0a0c14')
    gs = gridspec.GridSpec(2, 3, hspace=0.35, wspace=0.3)

    # ── Panel 1: Spike Raster ──
    ax1 = fig.add_subplot(gs[0, :2])
    ax1.set_facecolor('#0d0f1a')
    for ch in range(8):
        spike_times = np.where(spikes[:, ch] > 0)[0]
        ax1.scatter(spike_times,
                   [ch] * len(spike_times),
                   s=8, c='#00d4ff', alpha=0.8)
    ax1.set_yticks(range(8))
    ax1.set_yticklabels(CHANNEL_NAMES, fontsize=7,
                        color='#8892b0')
    ax1.set_xlabel('Timestep', color='#8892b0', fontsize=8)
    ax1.set_title('Input Spike Pattern', color='white',
                  fontsize=10, fontweight='bold')
    ax1.tick_params(colors='#8892b0')

    # ── Panel 2: Channel Activity ──
    ax2 = fig.add_subplot(gs[0, 2])
    ax2.set_facecolor('#0d0f1a')
    rates = spikes.sum(axis=0) / spikes.shape[0]
    colors = ['#00d4ff' if r < 0.3 else '#ff6b6b'
              for r in rates]
    ax2.barh(range(8), rates, color=colors, height=0.6)
    ax2.set_yticks(range(8))
    ax2.set_yticklabels(CHANNEL_NAMES, fontsize=7,
                        color='#8892b0')
    ax2.set_title('Firing Rates', color='white',
                  fontsize=10, fontweight='bold')
    ax2.axvline(x=0.3, color='#ff6b6b', linestyle='--',
                alpha=0.5, linewidth=0.8)
    ax2.tick_params(colors='#8892b0')

    # ── Panel 3: Membrane Potential ──
    ax3 = fig.add_subplot(gs[1, :2])
    ax3.set_facecolor('#0d0f1a')
    ax3.plot(membrane[:, 0], color='#4ade80', alpha=0.8,
             label='Legitimate', linewidth=1.2)
    ax3.plot(membrane[:, 1], color='#ff6b6b', alpha=0.8,
             label='Fraud', linewidth=1.2)
    ax3.legend(fontsize=7, facecolor='#0d0f1a',
               edgecolor='#8892b0', labelcolor='#8892b0')
    ax3.set_xlabel('Timestep', color='#8892b0', fontsize=8)
    ax3.set_ylabel('Membrane V', color='#8892b0', fontsize=8)
    ax3.set_title('Decision Trace — Watch Evidence Build',
                  color='white', fontsize=10, fontweight='bold')
    ax3.tick_params(colors='#8892b0')

    # ── Panel 4: Risk Summary ──
    ax4 = fig.add_subplot(gs[1, 2])
    ax4.set_facecolor('#0d0f1a')
    ax4.axis('off')

    fraud_score = out_spikes[:, 1].sum()
    clean_score = out_spikes[:, 0].sum()
    confidence = fraud_score / max(fraud_score+clean_score, 1)

    risk_factors = [(CHANNEL_NAMES[i], rates[i])

    risk_factors.sort(key=lambda x: -x[1])

    summary = (

        f"\\nTop Risk Factors:\\n"

    for name, rate in risk_factors[:4]:
        summary += f"  ▸ {name}: {rate:.0%} active\\n"

    ax4.text(0.05, 0.95, summary, transform=ax4.transAxes,
             fontsize=8, color='#ccd6f6', fontfamily='monospace',
             verticalalignment='top')
    ax4.set_title('Risk Assessment', color='white',
                  fontsize=10, fontweight='bold')

    if save_path:

re detection system for epilepsy patients. It runs continuously on a neuromorphic chip, detecting seizure onset patterns in EEG with clinical-grade accuracy at a fraction of the power.",hackathonIdea:"Train an SNN on the BCI Competition EEG dataset to classify motor imagery (left hand vs right hand) — the foundation of thought-controlled prosthetics.",research:"Active areas: closed-loop deep brain stimulation, high-channel-count neural recording with on-chip spike sorting, neuromorphic cochlear implants."},{id:"health",icon:eS,title:"Always-On Health Monitoring",tagline:"Continuous diagnostics on a coin-cell battery for months",color:"emerald",problem:"Wearable health monitors need to run 24/7 analyzing ECG, EMG, or blood oxygen — but conventional ML drains batteries in hours. Cloud offloading adds latency and privacy risk.",solution:"SNNs process temporal biosignals naturally (heartbeats, muscle activations are inherently spike-like). On neuromorphic hardware, a cardiac arrhythmia detector runs at ~10µW — vs ~10mW for an equivalent CNN.",realWorld:"Researchers demonstrated memristor-based LIF neurons achieving 95.83% accuracy for arrhythmia detection and 99.79% for epilepsy detection, all running on-chip with no cloud dependency.",hackathonIdea:"Build a real-time ECG anomaly detector using snnTorch. Train on the MIT-BIH Arrhythmia Database, then benchmark energy per inference vs a standard PyTorch model.",research:"Active areas: on-chip sleep staging, continuous blood glucose prediction from PPG, neuromorphic hearing aids that adapt to environments."},{id:"space",icon:uS,title:"Space & Satellite AI",tagline:"Autonomous decision-making millions of miles from Earth",color:"amber",problem:"Satellites generate terabytes of imagery but have limited downlink bandwidth and no real-time ground station access. Radiation degrades conventional processors. Power budgets are extremely tight.",solution:"Neuromorphic chips are inherently radiation-tolerant (spiking is robust to bit flips — a noisy spike is still a spike). They can perform on-board image classification, anomaly detection, and event prioritization at milliwatt power.",realWorld:"ESA and NASA have both explored neuromorphic processors for on-board satellite intelligence. Intel's Loihi has been evaluated for autonomous space debris detection and earth observation tasks.",hackathonIdea:"Simulate a satellite edge-AI pipeline: take EuroSAT satellite imagery, train a spiking classifier to detect wildfires or floods, and measure energy-per-classification vs a ResNet baseline.",research:"Active areas: neuromorphic star trackers for spacecraft navigation, on-board hyperspectral analysis, deep space autonomous mission planning."},{id:"security",icon:fS,title:"Cybersecurity & Anomaly Detection",tagline:"Catching intrusions from temporal patterns in real-time",color:"rose",problem:"Network traffic is inherently temporal and bursty — millions of packets per second with rare attack patterns buried in noise. Traditional ML processes batched snapshots, missing timing-based attacks.",solution:"SNNs are built for temporal pattern detection. They naturally encode packet inter-arrival times, burst patterns, and timing anomalies as spike trains. Processing is event-driven — no computation wasted on normal traffic.",realWorld:"Research groups have demonstrated SNN-based network intrusion detection systems achieving detection accuracy comparable to LSTMs while requiring orders of magnitude less energy — critical for edge firewalls and IoT gateways.",hackathonIdea:"Encode the CICIDS-2017 network intrusion dataset as spike trains (packet timing → spike timing) and train an SNN to distinguish normal traffic from DDoS, port scans, and brute force attacks.",research:"Active areas: neuromorphic encryption, side-channel attack detection via power trace analysis, real-time malware classification from API call sequences."},{id:"environment",icon:xS,title:"Climate & Environmental Monitoring",tagline:"Sensor networks that run for years on a single battery",color:"teal",problem:"Environmental monitoring requires thousands of sensors deployed in remote locations — ocean buoys, forest canopies, arctic stations. Each must process data locally because connectivity is intermittent and power is scarce.",solution:"Neuromorphic sensors wake only when something changes — a sudden temperature spike, an unusual vibration, an acoustic pattern matching a target species. Between events, power draw is near zero.",realWorld:"BrainChip's Akida is being deployed in wildlife acoustic monitoring systems — identifying bird species and detecting illegal logging chainsaw sounds from continuous audio streams at <1mW.",hackathonIdea:"Build a neuromorphic acoustic event detector: train an SNN on urban/forest soundscapes to classify gunshots, chainsaws, or specific animal calls with ultra-low simulated power.",research:"Active areas: neuromorphic ocean current monitoring, wildfire smoke detection from distributed sensor arrays, coral reef health classification from underwater acoustics."},{id:"olfactory",icon:X2,title:"Electronic Nose & Chemical Sensing",tagline:"Neuromorphic systems that smell, taste, and sense",color:"orange",problem:"Chemical sensor arrays produce noisy, drifting, temporally-complex signals. Traditional pattern recognition fails because the signal isn't a clean image — it's a dynamic temporal trajectory.",solution:"The biological olfactory system is the original spiking neural network — it encodes chemical concentrations as spike rates and uses lateral inhibition to sharpen discrimination. Neuromorphic chips replicate this architecture naturally.",realWorld:"Intel demonstrated odor recognition on Loihi using a spiking model of the olfactory bulb — learning to distinguish 10 chemical hazards from a single exposure each, far outperforming traditional ML on few-shot learning.",hackathonIdea:"Replicate Intel's olfactory experiment: implement a spiking olfactory bulb model in snnTorch, train on a gas sensor dataset (UCI Machine Learning Repository), and compare few-shot learning to a CNN baseline.",research:"Active areas: explosive detection for security, food freshness monitoring, medical breath analysis for disease diagnosis (diabetic ketoacidosis, lung cancer biomarkers)."},{id:"vision",icon:K2,title:"Neuromorphic Vision & Event Cameras",tagline:"120dB dynamic range, µs latency, no motion blur",color:"sky",problem:"Conventional cameras capture redundant full frames. They fail in extreme lighting (tunnels → sunlight), produce motion blur at high speeds, and waste bandwidth on static pixels.",solution:'Dynamic Vision Sensors (DVS) output pixel-level brightness changes asynchronously — each pixel independently fires an "event" when it detects change. Combined with neuromorphic processors, the entire pipeline is event-driven.',realWorld:"Prophesee and SynSense event cameras are being integrated into automotive ADAS systems for high-speed pedestrian detection. Samsung invested in event camera technology for next-gen mobile cameras.",hackathonIdea:"Use the N-MNIST or DVS128 Gesture dataset (event-camera versions of standard benchmarks) to train a spiking classifier. Compare latency and accuracy to frame-based approaches.",research:"Active areas: event-based optical flow, neuromorphic depth estimation, high-speed industrial inspection (detecting defects on assembly lines moving at meters/second)."},{id:"audit",icon:$2,title:"Continuous Audit & 3-Way Matching",tagline:"Catching fraud from temporal anomalies, not just rule violations",color:"pink",problem:"Traditional 3-way matching (Purchase Order → Goods Receipt → Invoice) is batch-processed and rule-based. It flags thousands of false positives on static thresholds (e.g., amount differs by >2%), burying real fraud in noise. Auditors manually review ~80% of flagged items that turn out to be benign. Meanwhile, sophisticated fraud — slowly inflating amounts, timing manipulation, phantom vendor patterns — slips through because the rules don't understand temporal context.",solution:'Encode each financial event (PO creation, goods receipt, invoice submission, payment release) as a spike in a temporal stream. An SNN learns the normal "rhythm" of the procure-to-pay cycle: typical delays between PO and receipt, expected amount correlations, vendor behavior patterns. Anomalies produce abnormal spike patterns — an invoice arriving before goods receipt, a sudden bank detail change right before a large payment, amounts that creep upward over months. The SNN detects temporal deviations that static rules completely miss, while ignoring benign variations that create false positives.',realWorld:'Research at financial institutions has explored spiking neural networks for real-time transaction monitoring, achieving comparable fraud detection rates to deep learning models (LSTMs, Transformers) while processing continuously with significantly lower compute overhead. The event-driven nature means the system only consumes resources when transactions actually flow — unlike batch ML systems that periodically scan entire databases. The temporal sensitivity catches "slow-burn" fraud schemes (like gradual vendor overbilling) that evade traditional threshold-based audits.',hackathonIdea:"Build a neuromorphic 3-way matching engine: generate synthetic procure-to-pay data (POs, receipts, invoices with timestamps and amounts), inject fraud patterns (timing anomalies, amount inflation, duplicate invoices, phantom vendors), encode as spike trains, and train an SNN to flag anomalies. Benchmark false positive rate vs traditional rule-based matching. Bonus: add a dashboard showing spike patterns for flagged transactions so auditors can see WHY it was flagged.",research:"Active areas: continuous audit monitoring with neuromorphic processors at the edge (in ERP systems), real-time anti-money laundering (AML) on transaction streams, insurance claims fraud from temporal filing patterns, tax fraud de import torch.nn as nn
import snntorch as snn
from snntorch import surrogate

# Surrogate gradient for backprop through spikes
spike_grad = surrogate.fast_sigmoid(slope=25)
beta = 0.95  # membrane potential decay rate

class SpikingNet(nn.Module):
    def __init__(self):
        super().__init__()
        self.fc1 = nn.Linear(784, 256)    # input layer
        self.lif1 = snn.Leaky(beta=beta,  # spiking neuron
                     spike_grad=spike_grad)
        self.fc2 = nn.Linear(256, 10)     # output layer
        self.lif2 = snn.Leaky(beta=beta,
                     spike_grad=spike_grad)

    def forward(self, x):
        # Initialize membrane potentials
        mem1 = self.lif1.init_leaky()
        mem2 = self.lif2.init_leaky()

        spk2_rec = []  # record output spikes

        # Process input over 25 timesteps
        for step in range(25):
            cur1 = self.fc1(x)
            spk1, mem1 = self.lif1(cur1, mem1)
            cur2 = self.fc2(spk1)
            spk2, mem2 = self.lif2(cur2, mem2)
            spk2_rec.append(spk2)

        return torch.stack(spk2_rec, dim=0)`,filename:"spiking_net.py"},{step:3,title:"Train on MNIST",desc:"Standard PyTorch training loop — the only difference is we count output spikes to classify.",code:`from torchvision import datasets, transforms
from torch.utils.data import DataLoader
import snntorch.functional as SF

# Load MNIST
transform = transforms.Compose([
    transforms.ToTensor(),
    transforms.Lambda(lambda x: x.view(-1))
])
train_data = datasets.MNIST('.', train=True,
             download=True, transform=transform)
train_loader = DataLoader(train_data,
               batch_size=128, shuffle=True)

# Setup
net = SpikingNet()
optimizer = torch.optim.Adam(net.parameters(), lr=5e-4)
loss_fn = SF.ce_rate_loss()  # cross-entropy on spike rate

# Train for 1 epoch
for batch, (data, targets) in enumerate(train_loader):
    net.train()
    spk_rec = net(data)
    loss = loss_fn(spk_rec, targets)

    optimizer.zero_grad()
    loss.backward()
    optimizer.step()

    if batch % 50 == 0:
        acc = SF.accuracy_rate(spk_rec, targets)
